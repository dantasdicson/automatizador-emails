name: Disparador de E-mails

on:
  schedule:
    - cron: '0 */4 * * *'  # Roda a cada 4 horas
  workflow_dispatch:        # Permite rodar manualmente pelo site do GitHub

jobs:
  executar-disparador:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências (se houver)
        run: |
          python -m pip install --upgrade pip

      - name: Executar o script de disparos
        run: python disparador.py

      - name: Salvar progresso de volta no repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progresso.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualiza progresso.txt automaticamente [skip ci]" && git push)
